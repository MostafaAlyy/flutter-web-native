<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="description" content="A production Flutter Web application.">

  <!-- Responsive viewport WITHOUT zoom lockouts. Flutter's engine injects its own
       tag (width=device-width, initial-scale=1.0, maximum-scale=5.0) and strips
       user-scalable=no / maximum-scale=1 — shipping those only fails a11y audits. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Web App Manifest, theme color, and (for RTL apps) lang/dir. The engine sets
       language from the locale but never sets dir. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <title>App</title>

  <!-- Critical-path preloads. Keep <head> to link/style/script/meta/title only:
       any other element (div, img, picture) closes <head> early and pushes the
       rest of it — CSP meta included — into <body>.
       Generate these at build/deploy time; never hand-maintain versions:
       - Blink + WasmGC gets dart2wasm + Skwasm by default (flutter.js
         wasmAllowList), so preload that path; dart2js stays a classic script.
       - Firebase JS SDK bundles that main() awaits (bare modulepreload, no
         crossorigin), version from firebase_core_web's
         supportedFirebaseJsSdkVersion. -->
  <link rel="modulepreload" href="main.dart.mjs">
  <link rel="preload" href="main.dart.wasm" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin="anonymous">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <style>
    /* Clean reset: allow natural visual-viewport panning and DPR scaling. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Host element sizing. Opt into browser pinch-zoom ONLY — the engine already
       owns single-finger panning (it sets touch-action: none on its host), so
       granting pan-x/pan-y here causes double-scroll. If an in-app pinch
       surface (PDF/InteractiveViewer) exists, omit this and let the engine own
       gestures on those screens. */
    flutter-view {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: pinch-zoom;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }

    /* CRITICAL: DO NOT add width/height overrides to "flutter-view canvas".
       Doing so overrides Flutter's devicePixelRatio buffer calculation
       and causes blurry text and offset mouse click coordinates. */
  </style>

  <!-- App-wide smooth mouse-wheel easing (examples/smooth_wheel_shim.js).
       Deferred: it only has to be live by the first wheel event. -->
  <script src="smooth_wheel_shim.js" defer></script>
</head>
<body>
  <!-- The splash image is the page's LCP element: explicit width/height (1x
       intrinsic size) and fetchpriority="high"; no decoding="async" or
       loading="lazy". Removed on the flutter-first-frame event. -->
  <div id="splash" aria-hidden="true">
    <img src="splash/logo.png" srcset="splash/logo.png 1x, splash/logo@2x.png 2x"
         width="160" height="160" fetchpriority="high" alt="">
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
