<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A production Flutter Web application.">

  <!-- Responsive Viewport without zoom lockouts -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Web App Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <title>App</title>

  <style>
    /* Clean Reset: allow natural visual viewport panning and DPR scaling */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Host Element Touch & Pointer Configuration */
    flutter-view {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: pan-x pan-y pinch-zoom;
    }

    /* CRITICAL: DO NOT add width/height overrides to "flutter-view canvas".
       Doing so overrides Flutter's devicePixelRatio buffer calculation
       and causes blurry text and offset mouse click coordinates. */
  </style>

  <script>
    // Prevent Safari gesture conflicts while maintaining native pinch zoom
    document.addEventListener('gesturestart', function(e) {
      // Passive listener allowing visual viewport gestures
    }, { passive: true });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
